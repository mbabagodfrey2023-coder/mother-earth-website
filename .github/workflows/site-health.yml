name: Foundation Mode Runner Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-mode-runner-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Local foundation containment contract
        run: node scripts/check-syntax.js

      - name: Sanitized public-contract diagnostics
        shell: bash
        run: |
          set -u

          probe() {
            label="$1"
            url="$2"
            expected_marker="$3"
            follow_redirects="$4"

            headers=$(mktemp)
            body=$(mktemp)
            curl_args=(
              --silent
              --show-error
              --max-time 20
              --user-agent "MEKE-Foundation-Monitor/1.0"
              --dump-header "$headers"
              --output "$body"
              --write-out '%{http_code}'
            )
            if [ "$follow_redirects" = "yes" ]; then
              curl_args+(--location)
            fi

            status=$(curl "${curl_args[@]}" "$url" 2>/dev/null || printf 'curl-error')
            public_mode=$(tr -d '\r' < "$headers" | awk -F': *' 'tolower($1)=="x-meke-public-mode" {print tolower($2)}' | tail -1)

            if grep -Fq "$expected_marker" "$body"; then
              marker_present=yes
            else
              marker_present=no
            fi

            if tr -d '\r' < "$headers" | grep -qi '^cf-ray:'; then
              cf_ray_present=yes
            else
              cf_ray_present=no
            fi

            printf '%s status=%s public_mode=%s marker_present=%s cf_ray_present=%s\n' \
              "$label" "$status" "${public_mode:-absent}" "$marker_present" "$cf_ray_present"

            rm -f "$headers" "$body"
          }

          probe homepage 'https://motherearth.systems/' \
            'Public autonomous services are paused' yes
          probe api 'https://motherearth.systems/api/chat' \
            'Public services are paused' no
          probe internal 'https://motherearth.systems/.git/config' \
            'Public services are paused' no

          echo 'Diagnostic complete: no response bodies or credentials were printed.'
