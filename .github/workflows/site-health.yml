name: Foundation Containment Source Check

on:
  push:
    branches: [main]
    paths:
      - '.assetsignore'
      - '.github/workflows/site-health.yml'
      - 'foundation-status.html'
      - 'scripts/check-syntax.js'
      - 'src/worker.js'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-containment-source
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Validate foundation containment source contract
        run: node scripts/check-syntax.js

      - name: Monitoring boundary
        run: |
          echo 'GitHub validates source only.'
          echo 'The deployed foundation contract is checked by the existing 06:00 UTC Cloudflare Cron Trigger.'
