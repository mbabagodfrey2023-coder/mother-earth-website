name: Site Health Check

on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC daily — cloud-side, Mac-independent
  push:
    paths: ['index.html']   # also runs on every deploy commit
  workflow_dispatch:        # manual trigger from GitHub UI

permissions:
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax gate — block bad JS before it can reach prod
        run: node scripts/check-syntax.js

      - name: Local HTML — key strings present
        # Grep the checked-out file (avoids Cloudflare IP blocking on runner)
        run: |
          grep -q "ticker-ice"        index.html || (echo "FAIL: ticker-ice missing"         && exit 1)
          grep -q "fetchLiveData"     index.html || (echo "FAIL: fetchLiveData missing"      && exit 1)
          grep -q "MeshBasicMaterial" index.html || (echo "FAIL: globe code missing"         && exit 1)
          grep -q "PVT-PQ1AZ3KV"     index.html || (echo "FAIL: Company reg number missing" && exit 1)
          grep -q "Starting in Kenya" index.html || (echo "FAIL: Mission Statement missing"  && exit 1)
          echo "✓ All key strings present in local HTML"

      - name: Feature integrity — Orbital Spectrum theme (agreed 2 Jul 2026)
        # If these fail someone has accidentally reverted the agreed palette — auto-alert ECHO
        run: |
          grep -q -- "--surface: #02101e"  index.html || (echo "FAIL: Orbital Spectrum bg #02101e missing — theme reverted?"   && exit 1)
          grep -q "1eff8c"                 index.html || (echo "FAIL: Orbital Spectrum green #1eff8c missing — theme reverted?" && exit 1)
          grep -q "4db8ff"                 index.html || (echo "FAIL: Orbital Spectrum blue #4db8ff missing — theme reverted?"  && exit 1)
          grep -q "d4eeff"                 index.html || (echo "FAIL: Orbital Spectrum text #d4eeff missing — theme reverted?"  && exit 1)
          echo "✓ Orbital Spectrum palette intact"

      - name: Feature integrity — Earth Debt Clock teaser (agreed 2 Jul 2026)
        run: |
          grep -q "debt-clock-teaser"  index.html || (echo "FAIL: Earth Debt Clock teaser section missing from homepage" && exit 1)
          grep -q "edc-carbon"         index.html || (echo "FAIL: Carbon counter (edc-carbon) missing from teaser"       && exit 1)
          grep -q "edc-trees"          index.html || (echo "FAIL: Trees counter (edc-trees) missing from teaser"         && exit 1)
          grep -q "edc-plastic"        index.html || (echo "FAIL: Plastic counter (edc-plastic) missing from teaser"     && exit 1)
          echo "✓ Earth Debt Clock teaser present"

      - name: Feature integrity — ECHO system (agreed 2 Jul 2026)
        run: |
          grep -q "PLAIN TEXT ONLY"    src/worker.js || (echo "FAIL: ECHO no-markdown rule missing from worker.js"           && exit 1)
          grep -q "earth-debt-clock"   src/worker.js || (echo "FAIL: Earth Debt Clock page missing from ECHO worker context"  && exit 1)
          echo "✓ ECHO system integrity confirmed"

      - name: Live site — Cloudflare responding (not 5xx)
        id: http
        run: |
          # 200 or 403 both mean Cloudflare/Worker is up. Only 5xx or timeout = real outage.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://motherearth.systems)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "HTTP $STATUS"
          [[ "$STATUS" == 2* || "$STATUS" == 403 ]] || exit 1

      - name: Live data — freshness check
        run: |
          DATA=$(curl -s --max-time 15 https://motherearth.systems/live-data.json)
          echo "$DATA" | python3 -c "
          import sys, json
          from datetime import datetime, timezone
          raw = sys.stdin.read()
          if not raw.strip():
              print('SKIP: live-data.json endpoint returned empty — Cloudflare blocks runner IPs on JSON endpoints too')
              sys.exit(0)
          try:
              d = json.loads(raw)
          except json.JSONDecodeError:
              print('SKIP: live-data.json returned non-JSON (likely Cloudflare challenge page)')
              sys.exit(0)
          updated = datetime.fromisoformat(d['updated'].replace('Z','+00:00'))
          age_h = (datetime.now(timezone.utc) - updated).total_seconds() / 3600
          co2 = d['environmental']['co2_ppm']
          print(f'CO2: {co2} ppm | Data age: {age_h:.1f}h')
          if age_h > 24:
              print(f'FAIL: live-data.json is {age_h:.0f}h old — WEB agent may be down')
              sys.exit(1)
          print('OK: live data is fresh')
          "

      - name: Report success
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✓ motherearth.systems HEALTHY"
          echo "✓ Syntax clean"
          echo "✓ Key strings in HTML"
          echo "✓ Orbital Spectrum palette intact"
          echo "✓ Earth Debt Clock teaser present"
          echo "✓ ECHO system intact"
          echo "✓ Cloudflare responding"
          echo "✓ Live data fresh"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Site health failure — ${new Date().toISOString().slice(0,10)}`,
              body: [
                '## Automated Health Check Failed',
                '',
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '**Checks run:**',
                '- Syntax gate',
                '- Key JS strings in local HTML',
                '- Orbital Spectrum theme integrity (--surface #02101e, green #1eff8c, blue #4db8ff)',
                '- Earth Debt Clock teaser section (debt-clock-teaser, edc-carbon, edc-trees, edc-plastic)',
                '- ECHO system integrity (no-markdown rule, earth-debt-clock context)',
                '- Cloudflare HTTP response (not 5xx)',
                '- live-data.json freshness',
                '',
                '**Action required:** Check the failed step above. If an agreed feature was accidentally reverted,',
                'restore it in the source file and push to main — the deploy workflow will fire automatically.',
                '',
                '_This issue was opened automatically by the ECHO site health monitor._'
              ].join('\n'),
              labels: ['bug', 'automated']
            });

      - name: Email Andy on feature regression
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python3 -c "
          import smtplib, os
          from email.mime.text import MIMEText
          user = os.environ.get('SMTP_USER','')
          pw   = os.environ.get('SMTP_PASS','')
          if not user or not pw:
              print('SMTP secrets not set — skipping email alert')
              exit(0)
          msg = MIMEText('''ECHO ALERT: motherearth.systems health check failed.

          One or more agreed features may have regressed:
          - Orbital Spectrum theme (#02101e / #1eff8c / #4db8ff)
          - Earth Debt Clock teaser on homepage
          - ECHO no-markdown rule or Earth Debt Clock context

          GitHub Actions run: https://github.com/andygodfrey031/mother-earth/actions

          Action: Check the failed step, restore the feature in source, push to main.
          The deploy workflow fires automatically on push — no manual deploy needed.

          — ECHO / Site Health Monitor''')
          msg['Subject'] = 'ECHO ALERT: Site feature regression detected'
          msg['From']    = user
          msg['To']      = 'andygodfrey031@gmail.com'
          s = smtplib.SMTP_SSL('smtp.gmail.com', 465)
          s.login(user, pw)
          s.sendmail(user, ['andygodfrey031@gmail.com'], msg.as_string())
          s.quit()
          print('Alert email sent to Andy')
          " || echo "Email step failed — GitHub Issue already created"
